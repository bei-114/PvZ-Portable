name: Build APK (PvzpMod)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stable monotonic git revision count for APK updates
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: NDK
        run: |
          if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV; else yes | sdkmanager --install "ndk;27.1.12297006" >/dev/null; echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV; fi
      - name: SDL2
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          tar xf SDL2-2.32.10.tar.gz && mv SDL2-2.32.10 sdl2-src
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Build SDL2
        run: |
          cmake -B b1 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$ANDROID_API -DSDL_SHARED=ON -DSDL_STATIC=OFF -DCMAKE_INSTALL_PREFIX=$PWD/sdl2out -DCMAKE_BUILD_TYPE=Release sdl2-src
          cmake --build b1 -j$(nproc) && cmake --install b1
      - name: Build native
        run: |
          cmake -B b2 -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-android -DVCPKG_CMAKE_SYSTEM_VERSION=$ANDROID_API -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-$ANDROID_API -DSDL2_DIR=$PWD/sdl2out/lib/cmake/SDL2 -DCMAKE_BUILD_TYPE=Release
          cmake --build b2 -j$(nproc)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp -L b2/libmain.so android/app/src/main/jniLibs/arm64-v8a/
          cp -L sdl2out/lib/libSDL2*.so android/app/src/main/jniLibs/arm64-v8a/
          cp -L b2/vcpkg_installed/arm64-android/lib/*.so android/app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Restore fixed release signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.PVZP_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_B64:?Configure encrypted release-signing Secrets before publishing an APK}"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pvzp-release.p12"
          echo "PVZP_KEYSTORE_FILE=$RUNNER_TEMP/pvzp-release.p12" >> "$GITHUB_ENV"
      - name: APK
        env:
          PVZP_KEYSTORE_TYPE: PKCS12
          PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_SIGNING_PASSWORD }}
          PVZP_KEY_ALIAS: pvzp-mod
          PVZP_KEY_PASSWORD: ${{ secrets.PVZP_SIGNING_PASSWORD }}
        run: |
          cd android && echo "sdk.dir=$ANDROID_HOME" > local.properties && gradle wrapper && ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon
      - run: mkdir -p dist && find android -name "*.apk" -path "*/release/*" -exec cp {} dist/apk.apk \;
      - name: Verify fixed release certificate
        run: |
          set -euo pipefail
          tool=""
          for candidate in "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner; do
            if [ -x "$candidate" ]; then tool="$candidate"; fi
          done
          test -n "$tool"
          "$tool" verify --verbose --print-certs dist/apk.apk | tee dist/signature.txt
          python3 - <<'PY'
          import pathlib, re
          expected = pathlib.Path('android/release-signing-sha256.txt').read_text().strip().lower()
          actual = re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]+)', pathlib.Path('dist/signature.txt').read_text())
          assert len(actual) == 1 and actual[0].lower() == expected, 'Release signer changed; do not publish an incompatible update'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pvz-mod-apk
          path: dist/
